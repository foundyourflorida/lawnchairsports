name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'   # daily at 12:00 UTC — pulls new episodes/videos automatically
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Refresh episodes + videos from YouTube/RSS. If scraping fails
      # (e.g. YouTube blocks the runner), fall back to the committed data.
      - name: Refresh content
        run: |
          python update-videos.py && python update-episodes.py \
            || echo "::warning::Content refresh failed — deploying with committed data"

      # Build the public site — everything except the admin page and tooling.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html episodes.html videos.html merch.html CNAME css js data assets _site/
          rm -f _site/data/feed.xml _site/data/youtube.xml

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
